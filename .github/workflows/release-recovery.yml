name: Release recovery

# Recovers a release whose version commit and tag exist but whose public GitHub Release
# was never created. It re-runs the same validated release pipeline for the
# existing tag; it never calculates a version, creates a tag, or publishes on its
# own.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag whose public release is missing (for example v0.67.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-recovery
  cancel-in-progress: false

jobs:
  resolve:
    name: Verify interrupted release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.recovery.outputs.version }}
      release_tag: ${{ steps.recovery.outputs.release_tag }}
      release_sha: ${{ steps.recovery.outputs.release_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Verify the tag is an unpublished release on main
        id: recovery
        env:
          GH_TOKEN: ${{ github.token }}
          ASTER_RECOVERY_TAG: ${{ inputs.release_tag }}
        run: node scripts/resolve-release-recovery.mjs

  release-pipeline:
    name: Build and publish validated release
    needs: resolve
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.resolve.outputs.version }}
      release_tag: ${{ needs.resolve.outputs.release_tag }}
      release_sha: ${{ needs.resolve.outputs.release_sha }}
