[package]
name = "aster-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Execution runtime boundary and ABI for JIT-compiled Aster programs"

[features]
aarm-telemetry = []
# MEM-EXP-1 experiment only: size-class heap for escaping class objects.
mem-exp-heap = []
# MEM-EXP-1 stage C: reference-count initialization and retain/release exports.
mem-exp-rc = ["mem-exp-heap"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59.0", features = [
    "Win32_Security_Cryptography",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.186"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
