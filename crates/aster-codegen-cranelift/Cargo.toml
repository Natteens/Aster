[package]
name = "aster-codegen-cranelift"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Cranelift JIT backend for Aster MIR"

[features]
aarm-telemetry = ["aster-runtime/aarm-telemetry", "dep:windows-sys"]

[[example]]
name = "aarm_memory_matrix"
path = "examples/aarm_memory_matrix.rs"
required-features = ["aarm-telemetry"]

[[example]]
name = "aarm_iteration_loop"
path = "examples/aarm_iteration_loop.rs"

[[example]]
name = "aarm_production_selector"
path = "examples/aarm_production_selector.rs"
required-features = ["aarm-telemetry"]

[[example]]
name = "local_object_elimination_matrix"
path = "examples/local_object_elimination_matrix.rs"
required-features = ["aarm-telemetry"]

[[example]]
name = "constructor_object_elimination_matrix"
path = "examples/constructor_object_elimination_matrix.rs"
required-features = ["aarm-telemetry"]

[[example]]
name = "helper_collection_retention"
path = "examples/helper_collection_retention.rs"
required-features = ["aarm-telemetry"]

[dependencies]
aster-mir = { path = "../aster-mir", version = "0.56.4" }
aster-runtime = { path = "../aster-runtime", version = "0.56.4" }
aster-types = { path = "../aster-types", version = "0.56.4" }
cranelift-codegen = "=0.121.2"
cranelift-frontend = "=0.121.2"
cranelift-jit = "=0.121.2"
cranelift-module = "=0.121.2"

[dev-dependencies]
aster-compiler = { path = "../aster-compiler", version = "0.56.4" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59.0", features = [
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
], optional = true }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
