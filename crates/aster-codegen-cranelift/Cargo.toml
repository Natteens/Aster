[package]
name = "aster-codegen-cranelift"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Cranelift JIT backend for Aster MIR"

[features]
aarm-telemetry = ["aster-runtime/aarm-telemetry", "dep:windows-sys"]
# MEM-EXP-1 configurations C1 to C3 (experiment only, mutually exclusive):
# class objects get an 8-, 12-, or 16-byte header with a descriptor word at
# offset 0. No feature means C0, the current headerless layout.
mem-exp-h8 = []
mem-exp-h12 = []
mem-exp-h16 = []
# MEM-EXP-1 configuration C4: H12 header plus the size-class heap.
mem-exp-c4 = ["mem-exp-h12", "aster-runtime/mem-exp-heap"]
# MEM-EXP-1 configuration C5: C4 plus the ownership pass, descriptors, and
# reference-count lowering (naive counting, no elision).
mem-exp-c5 = ["mem-exp-c4", "aster-runtime/mem-exp-rc"]
# MEM-EXP-1 configuration C6: C5 plus retain/release elision.
mem-exp-c6 = ["mem-exp-c5"]

[[example]]
name = "aarm_memory_matrix"
path = "examples/aarm_memory_matrix.rs"
required-features = ["aarm-telemetry"]

[[example]]
name = "mem_exp_pass_time"
path = "examples/mem_exp_pass_time.rs"

[[example]]
name = "mem_exp_counts"
path = "examples/mem_exp_counts.rs"
required-features = ["mem-exp-c5"]

[[example]]
name = "aarm_iteration_loop"
path = "examples/aarm_iteration_loop.rs"

[[example]]
name = "aarm_production_selector"
path = "examples/aarm_production_selector.rs"
required-features = ["aarm-telemetry"]

[[example]]
name = "local_object_elimination_matrix"
path = "examples/local_object_elimination_matrix.rs"
required-features = ["aarm-telemetry"]

[[example]]
name = "constructor_object_elimination_matrix"
path = "examples/constructor_object_elimination_matrix.rs"
required-features = ["aarm-telemetry"]

[[example]]
name = "helper_collection_retention"
path = "examples/helper_collection_retention.rs"
required-features = ["aarm-telemetry"]

[[example]]
name = "string_construction_matrix"
path = "examples/string_construction_matrix.rs"
required-features = ["aarm-telemetry"]

[[example]]
name = "practical_stdlib_matrix"
path = "examples/practical_stdlib_matrix.rs"
required-features = ["aarm-telemetry"]

[[example]]
name = "array_loop_matrix"
path = "examples/array_loop_matrix.rs"
required-features = ["aarm-telemetry"]

[dependencies]
aster-mir = { path = "../aster-mir", version = "0.71.0" }
aster-runtime = { path = "../aster-runtime", version = "0.71.0" }
aster-types = { path = "../aster-types", version = "0.71.0" }
cranelift-codegen = "=0.123.20"
cranelift-frontend = "=0.123.20"
cranelift-jit = "=0.123.20"
cranelift-module = "=0.123.20"

[dev-dependencies]
aster-compiler = { path = "../aster-compiler", version = "0.71.0" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59.0", features = [
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
], optional = true }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
