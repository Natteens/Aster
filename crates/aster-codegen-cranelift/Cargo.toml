[package]
name = "aster-codegen-cranelift"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Cranelift JIT backend for Aster MIR"

[features]
aarm-telemetry = ["aster-runtime/aarm-telemetry"]

[[example]]
name = "aarm_memory_matrix"
path = "examples/aarm_memory_matrix.rs"
required-features = ["aarm-telemetry"]

[dependencies]
aster-mir = { path = "../aster-mir", version = "0.55.0" }
aster-runtime = { path = "../aster-runtime", version = "0.55.0" }
aster-types = { path = "../aster-types", version = "0.55.0" }
cranelift-codegen = "=0.121.2"
cranelift-frontend = "=0.121.2"
cranelift-jit = "=0.121.2"
cranelift-module = "=0.121.2"

[dev-dependencies]
aster-compiler = { path = "../aster-compiler", version = "0.55.0" }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.59.0", features = [
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
